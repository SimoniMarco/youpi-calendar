name: Sync kalender
on:
  schedule:
    - cron: '0 2 * * *'      # elke nacht omstreeks 04:00 Belgische tijd
  workflow_dispatch:          # knop om handmatig te starten
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Genereer bookings.json
        env:
          ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
        run: node sync.js
      - name: Opslaan indien gewijzigd
        run: |
          git config user.name "youpi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bookings.json
          git diff --staged --quiet || git commit -m "Kalender automatisch bijgewerkt"
          git push
